# Build and test occutils on Linux, macOS and Windows: vcpkg (the deps/vcpkg submodule, at the registry baseline of
# vcpkg-configuration.json) installs the dependencies, CMake builds with the repository's preset, CTest runs the tests.
# A cold vcpkg cache builds OCCT, which takes about an hour per platform; vcpkg's binary cache keeps it between runs.
name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # keeps the vcpkg caches: GitHub evicts caches unused for 7 days (off the full hour, scheduled runs can start late)
  schedule:
    - cron: "17 4 * * 1,4"

# a newer push to a pull request cancels its run in flight; runs on main queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # the preset's toolchain (CMakePresets.json) takes vcpkg from here, too
  VCPKG_ROOT: ${{ github.workspace }}/deps/vcpkg
  VCPKG_DISABLE_METRICS: "1"
  # vcpkg's binary cache, kept between runs by actions/cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # vcpkg's gperf port builds with the system's autotools; OCCT's visualization needs the X11 and OpenGL headers
      - name: build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get install -y --no-install-recommends autoconf autoconf-archive automake libtool pkg-config \
            libx11-dev libxi-dev libxext-dev libxmu-dev libgl1-mesa-dev libglu1-mesa-dev libfontconfig1-dev \
            libfreetype-dev tcl-dev tk-dev
      - name: build tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install autoconf autoconf-archive automake libtool pkg-config
      # cl.exe and the Windows SDK for Ninja, from the newest Visual Studio with the C++ tools
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            # only what VsDevCmd changed (PATH, INCLUDE, LIB, ...), not the runner's own variables, and not VCPKG_ROOT,
            # which it points at Visual Studio's own vcpkg
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -ne 'VCPKG_ROOT' -and
                [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ninja
        run: python -m pip install --disable-pip-version-check ninja

      - name: vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi

      # saved under a new key whenever the archives changed; a restore takes the newest. vcpkg's ABI hashes decide which
      # archives fit (they also cover the compiler and CMake of the runner image), so a stale one is rebuilt, never used.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/triplets/*.cmake') }}-
            vcpkg-${{ matrix.os }}-
      - id: restored
        name: fingerprint of the restored binary cache
        shell: bash
        run: |
          mkdir -p .vcpkg-cache
          echo "hash=$(find .vcpkg-cache -type f | sort | shasum -a 256 | cut -c1-64)" >> "$GITHUB_OUTPUT"

      # the configure runs the vcpkg install (manifest mode); --clean-after-build deletes each port's build tree after
      # its build (a failed port's stays for the logs): OCCT's would fill the runner's disk
      - name: configure
        run: cmake --preset occutils-ninja-multiconfiguration-vcpkg -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      # saved right after the install, also when it failed: the ports built so far are kept
      - id: archives
        if: ${{ !cancelled() }}
        name: did the vcpkg install change the binary cache?
        shell: bash
        run: |
          hash=$(find .vcpkg-cache -type f | sort | shasum -a 256 | cut -c1-64)
          if [ "$hash" != "${{ steps.restored.outputs.hash }}" ]; then changed=true; else changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "binary cache changed: $changed"
      - if: ${{ !cancelled() && steps.archives.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: build
        run: cmake --build --preset occutils-ninja-multiconfiguration-vcpkg --config Release

      - name: test
        run: ctest --preset occutils-ninja-multiconfiguration-vcpkg -C Release --output-on-failure

      - name: logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}
          path: |
            deps/vcpkg/buildtrees/**/*.log
            builds/**/*.log
          if-no-files-found: ignore

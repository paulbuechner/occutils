# The release PR, like changesets' "Version Packages": a push to main with entries in changes/ pending writes the next
# release into CHANGELOG.md and its version into CMakeLists.txt and vcpkg.json (scripts/release.py release), and opens or
# updates the pull request "Release occutils <version>". Merging it publishes: the merge's push finds CHANGELOG.md's
# newest release without its tag and creates the GitHub release v<version>, the release's section as its notes.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: release

on:
  # every push, not only one with entries: the pull request is rebuilt on the pushed commit (create-pull-request resets
  # its branch onto the base), so the release commit comes after everything it releases
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# runs queue rather than cancel each other: one may be publishing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  PYTHONUTF8: "1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the tag and the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: GitHub release of CHANGELOG.md's newest release, unless tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python scripts/release.py version --latest)
          if [[ -z "$version" ]]; then
            echo "no release in CHANGELOG.md"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is published"
          else
            python scripts/release.py changelog --version "$version" --output "$RUNNER_TEMP/release-notes.md"
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "occutils $version" --notes-file "$RUNNER_TEMP/release-notes.md"
            echo "occutils $version published" >> "$GITHUB_STEP_SUMMARY"
          fi

  release-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: release
        name: write the release into CHANGELOG.md, CMakeLists.txt and vcpkg.json
        run: |
          version=$(python scripts/release.py release --if-pending)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$version" ]]; then
            python scripts/release.py changelog --version "$version" --pull-request "$GITHUB_REF_NAME" \
              --output "$RUNNER_TEMP/release-pr.md"
          else
            echo "nothing pending in changes/"
          fi
      - if: steps.release.outputs.version != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: release/${{ github.ref_name }}
          delete-branch: true
          sign-commits: true
          commit-message: "chore(release): occutils ${{ steps.release.outputs.version }}"
          title: "Release occutils ${{ steps.release.outputs.version }}"
          body-path: ${{ runner.temp }}/release-pr.md
          add-paths: |
            CHANGELOG.md
            CMakeLists.txt
            vcpkg.json
            changes
